[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubrid-wsl-installer-test"
version = "0.1.0"
description = "QA automation starter framework for the CUBRID For WSL Installer (TOOLS-4939)"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Only the wizard track needs pywinauto. Installing it is not required to run
# the silent tests, so it stays an extra rather than a hard dependency.
ui = ["pywinauto>=0.6.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:cacheprovider: destructive suites run elevated and read-only ones do
# not. A shared .pytest_cache left behind by an elevated run cannot be written
# by the next ordinary run. The cache only powers --lf/--nf, which a suite this
# slow has no use for.
addopts = "-ra --strict-markers -p no:cacheprovider"
markers = [
    "silent: driven through the installer's unattended CLI",
    "ui: driven through the wizard UI (pywinauto)",
    "destructive: installs or uninstalls the product; needs an elevated shell",
    "environment: read-only framework self-check; no product required",
    "action: starts, stops, connects, queries or creates against the installed product; sorted after the observation cases sharing its machine state",
]
