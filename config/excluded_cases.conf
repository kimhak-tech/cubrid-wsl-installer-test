# Cases to leave out of every run -- the suites, a category (-Case OPS) and
# -SkipInstall alike. One case ID per line; each is reported as skipped. `#`
# starts a comment, so comment a line out to run that case again.
#
# A listed case still runs when it is the one case selected (-Case OPS-004).
#
# Example:
#   OPS-004    # slow download from ftp.cubrid.org

